<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.0">
    <title>Donor information</title>
</head>

<body>
    <fieldset>
        <h1>Donor Information</h1>
        <table>
            <!-- First name -->
            <tr>
                <td> <label for="fname">First Name:</label></td>
                <td><input type="text" id="fname" name="fname" required></td>

            </tr>

            <!-- Last name -->

            <tr>
                <td> <label for="Lname">Last Name:</label></td>
                <td><input type="text" id="Lname" name="Lname" required></td>

            </tr>

            <!-- Company -->

            <tr>
                <td> <label for="com">Company:</label></td>
                <td><input type="text" id="com" name="com"></td>

            </tr>

            <!-- Adress 1 -->

            <tr>
                <td> <label for="address">Address 1:</label></td>
                <td><input type="text" id="address" name="address" required></td>

            </tr>

            <!-- Address 2 -->

            <tr>
                <td> <label for="address2">Address 2:</label></td>
                <td><input type="text" id="address2" name="address2"></td>

            </tr>

            <!-- city -->

            <tr>
                <td> <label for="city">City:</label></td>
                <td><input type="text" id="city" name="city" required></td>

            </tr>



            <!-- State -->

            <tr>
                <td><label for="State">State:</label></td>
                <td>
                    <select id="State" name="State">

                        <option>Select a State</option>
                        <option>Dhaka</option>
                        <option>Chattogram</option>
                        <option>Khulna</option>
                    </select>
                </td>
            </tr>

            <!-- Zip Code -->

            <tr>
                <td> <label for="Zip">Zip Code:</label></td>
                <td><input type="text" id="Zip" name="Zip" required></td>

            </tr>




            <!-- Country -->

            <tr>
                <td><label for="country">Country:</label></td>
                <td>
                    <select id="country" name="country">

                        <option>Select a Country</option>
                        <option>UK</option>
                        <option>CANADA</option>
                        <option>ARGENTINA</option>
                    </select>
                </td>
            </tr>



            <!-- Phone -->

            <tr>
                <td> <label for="phone">Phone:</label></td>
                <td><input type="tel" id="phone" name="phone"></td>

            </tr>


            <!-- fax -->

            <tr>
                <td> <label for="fax">Fax:</label></td>
                <td><input type="tel" id="fax" name="fax"></td>

            </tr>


            <!-- Email -->

            <tr>
                <td> <label for="mail">Email:</label></td>
                <td><input type="email" id="mail" name="mail" required></td>

            </tr>


            <!-- Donation -->



            <tr>
                <td> <label>Donation Amount:</label><br>

                    (Check a button or type in your amount)

                <td>

                    <input type="radio" name="Amount" value="None"> None
                    <input type="radio" name="Amount" value="$50"> $50
                    <input type="radio" name="Amount" value="$75"> $75
                    <input type="radio" name="Amount" value="$100"> $100
                    <input type="radio" name="Amount" value="$250"> $250
                    <input type="radio" name="Amount" value="Other"> Other


                </td>

            </tr>

            <tr>
                <td></td>
                <td> <label for="amount">Others Amount $:</label>
                    <input type="number" id="amount" name="amount">
                </td>

            </tr>


            <!-- Recuring Donation -->

            <tr>
                <td> <label>Recuring Donation:</label><br>

                    (Check if yes)

                <td>

                    <input type="checkbox" value="I am Interested in giving on a regular basis"> I am Interested in
                    giving on a regular basis



                </td>

            </tr>

            <tr>
                <td></td>
                <td> <label for="credit">Monthly Credit Card $:</label>
                    <input type="number" id="credit" name="credit">

                    <label for="For"> For:</label>
                    <input type="number" id="month" name="month">
                    <label for="Month"> Month</label>


                </td>

            </tr>


        </table>

    </fieldset>

    <fieldset>
        <h2>Honorarium and Memorial Donation Information</h2>
        <table>


            <!-- like to make donation -->

            <tr>
                <td> <label>I would like to make this Donation:</label><br>

                <td>


                    <input type="radio" name="donationType" value="honor">
                    <label for="honor">To Honor</label><br>
                    <input type="radio" name="donationType" value="memory">
                    <label for="memory">In Memory of</label>




                </td>

            </tr>



            <!-- Name -->
            <tr>
                <td> <label for="name">Name:</label></td>
                <td><input type="text" name="name" required></td>

            </tr>

            <!-- Donation to-->
            <tr>
                <td> <label for="Donation">Acknowledge Donation To:</label></td>
                <td><input type="text" id="Donation" name="Donation"></td>

            </tr>

            <!-- address-->
            <tr>
                <td> <label for="address">Address:</label></td>
                <td><input type="text" name="address" required></td>

            </tr>

            <!-- Donation to-->
            <tr>
                <td> <label for="cityy"> City:</label></td>
                <td><input type="text" id="cityy" name="cityy"></td>

            </tr>


            <!-- State -->

            <tr>
                <td><label for="State">State:</label></td>
                <td>
                    <select id="State" name="State">

                        <option>Select a State</option>
                        <option>Dhaka</option>
                        <option>Chattogram</option>
                        <option>Khulna</option>
                    </select>
                </td>
            </tr>

            <!-- Zip Code -->

            <tr>
                <td> <label for="Zip">Zip Code:</label></td>
                <td><input type="number" name="Zip" required></td>

            </tr>














        </table>



    </fieldset>

    <td></td>
    <td>

        <input type="reset" value="Reset">
        <input type="submit" value="Continue">




    </td>




</body>

</html>
